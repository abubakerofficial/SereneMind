<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="ambientSunriseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="skyTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <linearGradient id="softTealGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <radialGradient id="sunGlowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="sunDiscGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>

    <linearGradient id="bgPlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>

  <!-- Clean Pure White Container with Soft Border -->
  <rect width="512" height="512" rx="128" fill="url(#bgPlateGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="#f1f5f9" stroke-width="2" />

  <!-- Calming Ambient Halo Behind Brain -->
  <circle cx="256" cy="245" r="160" fill="url(#sunGlowGrad)" filter="url(#ambientSunriseGlow)" />

  <!-- ==================== SUNRISE (Emerging in Center of Brain) ==================== -->
  <g id="sunrise-element">
    <!-- Rising Sun Core -->
    <circle cx="256" cy="240" r="42" fill="url(#sunDiscGrad)" filter="url(#softGlow)" />
    
    <!-- Gentle Radiant Dawn Rays (Continuous Minimalist Strokes) -->
    <path d="M256 168 L256 148" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" opacity="0.85" />
    <path d="M205 189 L191 175" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" opacity="0.85" />
    <path d="M307 189 L321 175" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" opacity="0.85" />
    <path d="M172 238 L152 238" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" opacity="0.75" />
    <path d="M340 238 L360 238" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" opacity="0.75" />
  </g>

  <!-- ==================== GENTLE WAVES (Mental Calm & Peace) ==================== -->
  <g id="gentle-waves">
    <!-- Calm Horizon Wave 1 -->
    <path d="M165 258 C 195 246, 225 268, 256 256 C 287 244, 317 268, 347 258" 
          fill="none" stroke="url(#waveGrad1)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Calm Flowing Wave 2 -->
    <path d="M180 286 C 205 276, 230 294, 256 284 C 282 274, 307 294, 332 284" 
          fill="none" stroke="url(#waveGrad2)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

    <!-- Calming Base Ripple 3 -->
    <path d="M200 314 C 220 306, 238 318, 256 312 C 274 306, 292 318, 312 314" 
          fill="none" stroke="#2dd4bf" stroke-width="5" stroke-linecap="round" opacity="0.75" />
  </g>

  <!-- ==================== FLOWING CONTINUOUS BRAIN SILHOUETTE ==================== -->
  <!-- Left Hemisphere (Smooth, continuous flowing pastel sky blue & teal line) -->
  <path d="
    M 252 355
    C 230 355, 205 345, 185 328
    C 160 307, 142 275, 142 238
    C 142 215, 150 196, 164 182
    C 152 168, 150 148, 162 132
    C 176 113, 202 110, 222 120
    C 233 108, 246 104, 252 104
  " 
  fill="none" 
  stroke="url(#skyTealGrad)" 
  stroke-width="9" 
  stroke-linecap="round" 
  stroke-linejoin="round"
  filter="url(#softGlow)" />

  <!-- Right Hemisphere (Harmonious continuous flowing line) -->
  <path d="
    M 260 104
    C 266 104, 279 108, 290 120
    C 310 110, 336 113, 350 132
    C 362 148, 360 168, 348 182
    C 362 196, 370 215, 370 238
    C 370 275, 352 307, 327 328
    C 307 345, 282 355, 260 355
  " 
  fill="none" 
  stroke="url(#softTealGrad)" 
  stroke-width="9" 
  stroke-linecap="round" 
  stroke-linejoin="round"
  filter="url(#softGlow)" />

  <!-- Internal Brain Folds / Organic Gyri (Continuous Flowing Curves) -->
  <!-- Left Inner Gyri -->
  <path d="
    M 215 132
    C 195 152, 180 180, 192 208
    C 198 222, 215 228, 224 218
    C 235 206, 230 188, 222 172
  " 
  fill="none" 
  stroke="url(#skyTealGrad)" 
  stroke-width="6" 
  stroke-linecap="round" 
  stroke-linejoin="round"
  opacity="0.85" />

  <!-- Right Inner Gyri -->
  <path d="
    M 297 132
    C 317 152, 332 180, 320 208
    C 314 222, 297 228, 288 218
    C 277 206, 282 188, 290 172
  " 
  fill="none" 
  stroke="url(#softTealGrad)" 
  stroke-width="6" 
  stroke-linecap="round" 
  stroke-linejoin="round"
  opacity="0.85" />

  <!-- Brainstem / Serenity Anchor at Bottom -->
  <path d="M246 360 C 246 385, 252 396, 252 408" 
        fill="none" stroke="#0ea5e9" stroke-width="6.5" stroke-linecap="round" opacity="0.8" />
  <path d="M266 360 C 266 385, 260 396, 260 408" 
        fill="none" stroke="#14b8a6" stroke-width="6.5" stroke-linecap="round" opacity="0.8" />

  <!-- Sparks of Clarity & Uplift (Subtle Stars/Dots) -->
  <circle cx="140" cy="155" r="5" fill="#38bdf8" />
  <circle cx="372" cy="155" r="5" fill="#2dd4bf" />
  <circle cx="256" cy="78" r="4.5" fill="#fbbf24" />
  <path d="M256 70 L256 86 M248 78 L264 78" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

  <circle cx="118" cy="256" r="3.5" fill="#bae6fd" />
  <circle cx="394" cy="256" r="3.5" fill="#99f6e4" />
</svg>
