<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="haloGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Base with rounded squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="url(#haloGrad)" />
  <circle cx="256" cy="256" r="160" stroke="#34d399" stroke-width="4" stroke-opacity="0.3" fill="none" stroke-dasharray="8 8" />

  <!-- Central Lotus / Serenity Petals -->
  <path d="M256 110 C270 180 320 220 370 256 C320 292 270 332 256 402 C242 332 192 292 142 256 C192 220 242 180 256 110 Z" fill="url(#gemGrad)" />
  <path d="M256 170 C265 210 295 235 325 256 C295 277 265 302 256 342 C247 302 217 277 187 256 C217 235 247 210 256 170 Z" fill="#ecfdf5" opacity="0.9" />

  <!-- Calming Center Core -->
  <circle cx="256" cy="256" r="28" fill="#047857" />
  <circle cx="256" cy="256" r="14" fill="#34d399" />

  <!-- Sparkle Accents -->
  <circle cx="340" cy="170" r="8" fill="#a7f3d0" />
  <circle cx="172" cy="342" r="8" fill="#a7f3d0" />
  <circle cx="360" cy="320" r="6" fill="#6ee7b7" />
  <circle cx="152" cy="192" r="6" fill="#6ee7b7" />
</svg>
